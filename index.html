<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>수학주제탐구 발표회 워크스페이스</title>
<style>
  :root{
    --bg:#EEF2F7; --grid:#D7DEEA;
    --ink:#16213E; --ink-soft:#5B6584; --ink-faint:#8B93AC;
    --paper:#FFFFFF; --line:#D3DAE6;
    --teal:#227C70; --teal-soft:#E4F1EE;
    --violet:#5B4B8A; --violet-soft:#EDEAF6;
    --amber:#A6721C; --amber-soft:#F6EDD9; --amber-line:#E5CE9C;
    --radius:14px;
    --mono: ui-monospace,"SF Mono","Consolas","Menlo",monospace;
    --sans: -apple-system,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","Segoe UI",sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--sans); color:var(--ink);
    background:
      repeating-linear-gradient(0deg, transparent, transparent 27px, var(--grid) 27px, var(--grid) 28px),
      repeating-linear-gradient(90deg, transparent, transparent 27px, var(--grid) 27px, var(--grid) 28px),
      var(--bg);
    min-height:100vh; line-height:1.6;
  }
  .wrap{max-width:1120px;margin:0 auto;padding:28px 20px 80px;}

  header.hero{background:var(--ink); color:#fff; border-radius:var(--radius); padding:24px 28px; position:relative; overflow:hidden; margin-bottom:16px;}
  header.hero::before{content:""; position:absolute; inset:0; background-image:radial-gradient(circle at 92% -10%, rgba(34,124,112,.45), transparent 55%); pointer-events:none;}
  .eyebrow{font-family:var(--mono); font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:#8FE0CE; margin:0 0 8px;}
  h1{font-size:24px; margin:0 0 6px; font-weight:800; letter-spacing:-.01em;}
  .sub{color:#B7BFE0; font-size:13.5px; margin:0;}

  /* tabs */
  .tabs{display:flex; gap:6px; background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:5px; margin-bottom:16px;}
  .tab-btn{flex:1; text-align:center; padding:11px 10px; border-radius:8px; border:none; background:none; cursor:pointer; font-family:var(--sans); font-weight:700; font-size:13.5px; color:var(--ink-soft); display:flex; align-items:center; justify-content:center; gap:7px;}
  .tab-btn .pct{font-family:var(--mono); font-size:11px; padding:1px 6px; border-radius:5px; background:#EEF2F7; color:var(--ink-faint);}
  .tab-btn.active{background:var(--ink); color:#fff;}
  .tab-btn.active .pct{background:rgba(255,255,255,.15); color:#fff;}
  .tab-btn:hover:not(.active){background:#F6F8FC;}

  .toolbar{display:flex; justify-content:flex-end; gap:8px; margin-bottom:14px;}
  .room-bar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:10px 14px; margin-bottom:14px; font-size:12.8px; color:var(--ink-soft);}
  .room-bar .dot{width:8px; height:8px; border-radius:50%; background:#C7D0DE; flex:none;}
  .room-bar .dot.on{background:var(--teal);}
  .room-bar b{color:var(--ink); font-family:var(--mono); letter-spacing:.02em;}
  .room-bar .spacer{flex:1;}
  .tool-btn{font-family:var(--mono); font-size:12px; padding:8px 13px; border-radius:8px; border:1px solid var(--line); background:#fff; cursor:pointer; color:var(--ink-soft);}
  .tool-btn:hover{border-color:var(--ink); color:var(--ink);}
  .tool-btn.accent{background:var(--ink); color:#fff; border-color:var(--ink);}
  .tool-btn.accent:hover{background:var(--teal); border-color:var(--teal);}
  .save-note{font-family:var(--mono); font-size:11px; color:var(--ink-faint); align-self:center; margin-right:auto;}

  .card{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); padding:22px 24px;}
  .card + .card{margin-top:16px;}
  .card-title{font-family:var(--mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-faint); margin:0 0 4px;}
  .card h2{font-size:17px; margin:2px 0 14px; font-weight:800;}

  /* overview form */
  .form-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px;}
  .form-grid .wide{grid-column:span 2;}
  @media (max-width:760px){.form-grid{grid-template-columns:1fr 1fr;} .form-grid .wide{grid-column:span 2;}}
  .form-field label{display:block; font-size:11px; color:var(--ink-faint); margin-bottom:5px; font-family:var(--mono); letter-spacing:.03em;}
  .form-field input{width:100%; padding:9px 10px; border-radius:9px; border:1px solid var(--line); background:#FBFCFE; font-size:13.5px; font-family:var(--sans); color:var(--ink);}
  .form-field input:focus{outline:2px solid var(--teal); outline-offset:1px; background:#fff;}

  .topic-current{border:1px solid #BFE2DA; background:var(--teal-soft); border-radius:10px; padding:12px 14px; margin:14px 0; font-size:13.5px;}
  .topic-current.empty{background:#FBFCFE; border-color:var(--line);}
  .topic-current b{color:var(--teal); font-family:var(--mono); font-size:11px; letter-spacing:.05em; display:block; margin-bottom:3px; text-transform:uppercase;}
  .topic-current.empty b{color:var(--ink-faint);}
  .notice-box{border:1px solid var(--amber-line); background:var(--amber-soft); border-radius:10px; padding:12px 14px; margin:14px 0; font-size:12.8px; color:#7A5613;}
  .notice-box ul{margin:4px 0 0; padding-left:18px;}
  .notice-box li{margin-bottom:4px; line-height:1.5;}
  .notice-box li:last-child{margin-bottom:0;}
  .notice-box b{color:var(--amber);}
  .unit-accordion{border:1px solid var(--line); border-radius:10px; overflow:hidden; margin-bottom:8px;}
  .unit-head{display:flex; justify-content:space-between; align-items:center; padding:10px 14px; background:#F6F8FC; cursor:pointer; font-size:13.5px; font-weight:700;}
  .unit-head:hover{background:#EFF3FA;}
  .unit-head .chev{font-family:var(--mono); color:var(--ink-faint); transition:transform .15s;}
  .unit-body{display:none; padding:6px 10px 10px;}
  .unit-accordion.open .unit-body{display:block;}
  .unit-accordion.open .chev{transform:rotate(90deg);}
  .topic-opt{padding:9px 10px; border-radius:8px; cursor:pointer; font-size:13px; color:var(--ink-soft); border:1px solid transparent;}
  .topic-opt:hover{background:var(--violet-soft); color:var(--ink);}
  .topic-opt.selected{background:var(--violet-soft); border-color:#CFC5E8; color:var(--violet); font-weight:700;}
  textarea{width:100%; font-family:var(--sans); font-size:14px; color:var(--ink); border:1px solid var(--line); border-radius:9px; padding:11px 12px; background:#FBFCFE; resize:vertical;}
  textarea:focus{outline:2px solid var(--teal); outline-offset:1px; background:#fff;}

  .topic-compact{border:1px solid var(--line); background:#F6F8FC; border-radius:10px; padding:12px 14px; font-size:13.5px; margin-bottom:20px; display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;}
  .topic-compact .txt b{display:block; font-family:var(--mono); font-size:10.5px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.05em; margin-bottom:3px; font-weight:700;}
  .linklike{background:none; border:1px solid var(--line); border-radius:7px; padding:6px 11px; font-size:12px; font-family:var(--sans); color:var(--teal); cursor:pointer; font-weight:700; white-space:nowrap;}
  .linklike:hover{background:var(--teal-soft);}

  /* overview progress cards */
  .ov-progress-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  @media (max-width:760px){.ov-progress-grid{grid-template-columns:1fr;}}
  .ov-card{border:1px solid var(--line); border-radius:12px; padding:18px 18px 16px;}
  .ov-card-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
  .ov-card-head h3{margin:0; font-size:15px;}
  .ov-pct{font-family:var(--mono); font-weight:800; font-size:20px; color:var(--teal);}
  .ov-bar{height:6px; background:#EEF2F7; border-radius:4px; overflow:hidden; margin-bottom:14px;}
  .ov-bar-fill{height:100%; background:var(--teal);}
  .mini-list{display:flex; flex-direction:column; gap:6px; margin-bottom:14px;}
  .mini-row{display:flex; align-items:center; gap:9px; font-size:12.8px; color:var(--ink-soft);}
  .mini-dot{width:16px; height:16px; border-radius:50%; border:2px solid var(--line); flex:none; display:flex; align-items:center; justify-content:center; font-size:9px; color:transparent;}
  .mini-dot.done{background:var(--teal); border-color:var(--teal); color:#fff;}
  .ov-open-btn{width:100%; padding:10px; border-radius:9px; border:none; background:var(--ink); color:#fff; font-weight:700; font-size:13px; cursor:pointer;}
  .ov-open-btn:hover{background:var(--teal);}

  /* journey (plan) */
  #journeySvgWrap{width:100%; overflow-x:auto;}
  #journeySvgWrap svg{display:block; min-width:640px;}
  .node-circle{cursor:pointer; transition:transform .15s ease;}
  .node-circle:hover{transform:scale(1.08);}
  .journey-mobile{display:none; flex-direction:column; gap:0; padding:4px 0 10px;}
  .jm-item{display:flex; align-items:flex-start; gap:12px; cursor:pointer; padding:6px 2px;}
  .jm-dot{width:30px; height:30px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center; font-family:var(--mono); font-size:13px; font-weight:700; border:2px solid var(--line); color:var(--ink-faint); background:#fff;}
  .jm-item.active .jm-dot{border-color:var(--teal); color:var(--teal); background:var(--teal-soft);}
  .jm-item.done .jm-dot{border-color:var(--teal); color:#fff; background:var(--teal);}
  .jm-body{padding-top:3px;}
  .jm-body .t{font-size:13.5px; font-weight:700;}
  .jm-body .s{font-size:12px; color:var(--ink-soft);}
  @media (max-width:720px){ #journeySvgWrap{display:none;} .journey-mobile{display:flex;} }

  /* generic layout for panels with side nav (report) */
  .layout{display:grid; grid-template-columns:230px 1fr; gap:16px; align-items:start;}
  @media (max-width:880px){ .layout{grid-template-columns:1fr;} }
  .toc-card{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); padding:16px; position:sticky; top:16px;}
  .toc-title{font-family:var(--mono); font-size:11px; color:var(--ink-faint); letter-spacing:.08em; text-transform:uppercase; margin:0 0 10px;}
  .toc-item{display:flex; align-items:flex-start; gap:10px; padding:9px 8px; border-radius:8px; cursor:pointer; margin-bottom:2px;}
  .toc-item:hover{background:#F6F8FC;}
  .toc-item.active{background:var(--teal-soft);}
  .toc-num{font-family:var(--mono); font-size:12px; font-weight:700; color:var(--ink-faint); flex:none; width:22px;}
  .toc-item.active .toc-num{color:var(--teal);}
  .toc-txt{font-size:13px; font-weight:600; color:var(--ink);}
  .toc-item.active .toc-txt{color:var(--teal);}
  .toc-bar{height:3px; background:var(--line); border-radius:2px; margin-top:5px; overflow:hidden;}
  .toc-bar-fill{height:100%; background:var(--teal); width:0%;}
  @media (max-width:880px){ .toc-card{position:static;} }

  /* session / section panel */
  .panel{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); padding:22px 24px 26px;}
  .panel-head{display:flex; align-items:baseline; gap:12px; margin-bottom:4px; flex-wrap:wrap;}
  .section-tag{font-family:var(--mono); font-size:12px; font-weight:700; color:var(--teal); background:var(--teal-soft); padding:3px 9px; border-radius:6px;}
  .panel-head h2{font-size:19px; margin:0; font-weight:800;}
  .panel-desc{color:var(--ink-soft); font-size:13px; margin:2px 0 20px;}
  .field-block{margin-bottom:20px;}
  .field-label{font-family:var(--mono); font-size:11px; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-faint); display:flex; align-items:center; gap:6px; margin-bottom:8px;}
  .field-hint{font-size:12.5px; color:var(--ink-faint); margin:0 0 8px; line-height:1.5;}
  input.text-input{width:100%; font-family:var(--sans); font-size:14px; color:var(--ink); border:1px solid var(--line); border-radius:9px; padding:10px 12px; background:#FBFCFE;}
  input.text-input:focus{outline:2px solid var(--teal); outline-offset:1px; background:#fff;}
  textarea{min-height:60px;}

  .list-rows{display:flex; flex-direction:column; gap:8px;}
  .list-row{display:flex; gap:8px; align-items:center;}
  .list-row input{flex:1;}
  .row-del{flex:none; width:28px; height:28px; border-radius:7px; border:1px solid var(--line); background:#fff; color:var(--ink-faint); cursor:pointer; font-size:15px; line-height:1;}
  .row-del:hover{border-color:#E38A8A; color:#C24545;}
  .add-btn{margin-top:8px; font-family:var(--mono); font-size:12px; color:var(--teal); background:none; border:1px dashed #9FCFC5; border-radius:8px; padding:7px 12px; cursor:pointer;}
  .add-btn:hover{background:var(--teal-soft);}
  .import-btn{margin:2px 0 0; font-family:var(--mono); font-size:11.5px; color:var(--violet); background:none; border:1px dashed #C9BEE5; border-radius:8px; padding:6px 11px; cursor:pointer;}
  .import-btn:hover{background:var(--violet-soft);}

  .checklist{display:flex; flex-direction:column; gap:6px;}
  .chk-row{display:flex; align-items:center; gap:10px; padding:7px 10px; border:1px solid var(--line); border-radius:8px; background:#FBFCFE;}
  .chk-row.done{background:var(--teal-soft); border-color:#BFE2DA;}
  .chk-row input[type=checkbox]{width:17px; height:17px; accent-color:var(--teal); flex:none;}
  .chk-row input[type=text]{flex:1; border:none; background:transparent; font-size:13.5px; padding:2px;}
  .chk-row input[type=text]:focus{outline:none;}
  .chk-row.done input[type=text]{color:var(--ink-soft); text-decoration:line-through;}

  .two-col{display:grid; grid-template-columns:1.3fr 1fr; gap:26px;}
  @media (max-width:820px){.two-col{grid-template-columns:1fr;}}

  .ref-rows{display:flex; flex-direction:column; gap:10px;}
  .ref-row{border:1px solid var(--line); border-radius:9px; padding:10px 12px; background:#FBFCFE; position:relative;}
  .ref-grid{display:grid; grid-template-columns:1fr 1fr 90px; gap:8px; margin-bottom:6px;}
  .ref-grid input{width:100%; border:1px solid var(--line); border-radius:7px; padding:7px 9px; font-size:12.8px; background:#fff;}
  .ref-grid input:focus{outline:2px solid var(--teal); outline-offset:1px;}
  .ref-row .ref-title{width:100%; border:1px solid var(--line); border-radius:7px; padding:7px 9px; font-size:13px; background:#fff; margin-bottom:6px;}
  .ref-del{position:absolute; top:8px; right:8px; width:24px; height:24px; border-radius:6px; border:1px solid var(--line); background:#fff; color:var(--ink-faint); cursor:pointer; font-size:14px; line-height:1;}
  .ref-del:hover{border-color:#E38A8A; color:#C24545;}

  .panel-nav{display:flex; justify-content:space-between; margin-top:24px; gap:10px;}
  .nav-btn{font-family:var(--sans); font-weight:700; font-size:13.5px; padding:10px 16px; border-radius:9px; border:1px solid var(--line); background:#fff; cursor:pointer; color:var(--ink);}
  .nav-btn:hover{border-color:var(--teal); color:var(--teal);}
  .nav-btn.primary{background:var(--ink); color:#fff; border-color:var(--ink);}
  .nav-btn.primary:hover{background:var(--teal); border-color:var(--teal); color:#fff;}
  .nav-btn:disabled{opacity:.35; cursor:not-allowed;}

  /* preview modal */
  .modal-overlay{display:none; position:fixed; inset:0; background:rgba(22,33,62,.55); z-index:50; align-items:flex-start; justify-content:center; padding:32px 16px; overflow-y:auto;}
  .modal-overlay.open{display:flex;}
  .doc{background:#fff; width:100%; max-width:800px; border-radius:12px; padding:0; position:relative;}
  .doc-close{position:absolute; top:16px; right:16px; width:32px; height:32px; border-radius:8px; border:1px solid var(--line); background:#fff; cursor:pointer; font-size:16px; color:var(--ink-soft); z-index:2;}
  .doc-cover{padding:70px 56px 50px; text-align:center; border-bottom:1px dashed var(--line);}
  .doc-cover .k1{font-family:var(--mono); font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--teal); margin-bottom:26px;}
  .doc-cover h1{font-size:26px; margin:0 0 10px; line-height:1.4;}
  .doc-cover .k2{font-size:14px; color:var(--ink-soft); margin-bottom:40px;}
  .doc-cover-table{margin:0 auto; border-collapse:collapse; font-size:13px;}
  .doc-cover-table td{padding:6px 14px; text-align:left; border-bottom:1px solid var(--line);}
  .doc-cover-table td.k{color:var(--ink-faint); font-family:var(--mono); font-size:11px;}
  .doc-body{padding:36px 50px 56px;}
  .doc-toc{margin-bottom:26px;}
  .doc-toc div{font-size:13.5px; padding:6px 0; border-bottom:1px dotted var(--line);}
  .doc-section{margin-bottom:24px; page-break-inside:avoid;}
  .doc-section h2{font-size:15.5px; border-bottom:2px solid var(--ink); padding-bottom:6px; margin:0 0 10px;}
  .doc-section h3{font-size:13px; color:var(--teal); margin:14px 0 5px;}
  .doc-section p{font-size:13px; color:var(--ink); margin:0 0 6px; white-space:pre-wrap;}
  .doc-section ul{margin:4px 0 0; padding-left:18px; font-size:12.8px; color:var(--ink-soft);}
  .doc-ref{font-size:12.5px; margin:0 0 6px; padding-left:18px; text-indent:-18px;}
  @media print{
    body *{visibility:hidden;}
    .doc, .doc *{visibility:visible;}
    .doc{position:absolute; top:0; left:0; width:100%; max-width:none; padding:0;}
    .doc-cover{page-break-after:always;}
    .doc-close{display:none;}
  }
</style>
</head>
<body>
<!-- Firebase (실시간 동기화용) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<div class="wrap">

  <header class="hero">
    <p class="eyebrow">공통수학 연계 · 통합 워크스페이스</p>
    <h1>수학주제탐구 발표회 워크스페이스</h1>
    <p class="sub">팀 정보와 탐구 주제를 한 번만 입력하면, 6차시 기획안과 탐구보고서를 함께 관리할 수 있습니다.</p>
  </header>

  <div class="room-bar" id="roomBar">
    <span class="dot" id="roomDot"></span>
    <span id="roomStatus">연결 중…</span>
    <span class="spacer"></span>
    <span>공유 코드 <b id="roomCode">-</b></span>
    <button class="tool-btn" id="copyLinkBtn">모둠원 초대 링크 복사</button>
    <input class="text-input" id="roomInput" placeholder="다른 모둠 코드 입력 (예: team2)" style="width:180px; padding:7px 9px; font-size:12.5px;">
    <button class="tool-btn" id="joinRoomBtn">이동</button>
    <button class="tool-btn" id="newRoomBtn">새 모둠 만들기</button>
  </div>

  <div class="tabs" id="tabs"></div>

  <div class="toolbar">
    <span class="save-note" id="saveNote">연결 중…</span>
    <button class="tool-btn" id="resetBtn">전체 초기화</button>
    <button class="tool-btn accent" id="previewBtn" style="display:none;">미리보기 / 인쇄</button>
  </div>

  <div id="view"></div>

</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="doc" id="docContent"></div>
</div>

<script>
/* ================= shared data ================= */
const TOPIC_BANK = [
  {unit:"다항식", topics:[
    "조립제법과 인수분해로 설계하는 간단한 암호의 원리",
    "다항식 나눗셈 알고리즘의 효율성 비교",
    "인수분해를 활용한 도형의 넓이 최적화 문제"]},
  {unit:"방정식과 부등식", topics:[
    "이차함수 그래프로 본 포물선 운동(투사체 궤적) 분석",
    "부등식의 영역과 선형계획법을 이용한 자원 배분 최적화",
    "복소수와 평면 위 회전변환의 관계 탐구"]},
  {unit:"경우의 수", topics:[
    "순열과 조합으로 분석하는 로또·복권 당첨 확률",
    "카드게임·보드게임 속 경우의 수와 필승 전략",
    "중복조합을 활용한 급식 메뉴 구성 경우의 수"]},
  {unit:"행렬", topics:[

function getRoomCode(){
  const params = new URLSearchParams(location.search);
  let room = params.get('room');
  if(!room){
    room = Math.random().toString(36).slice(2,8);
    params.set('room', room);
    history.replaceState(null, '', location.pathname + '?' + params.toString());
  }
  return room.toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,12) || 'default';
}
const ROOM = getRoomCode();

function initFirebase(){
  if(!FIREBASE_CONFIG.apiKey || FIREBASE_CONFIG.apiKey.indexOf('여기에')===0){
    setRoomStatus(false, "Firebase 설정이 비어 있어 이 브라우저에만 저장됩니다");
    return false;
  }
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.firestore();
    docRef = db.collection('math-inquiry-workspaces').doc(ROOM);
    attachmentsColRef = docRef.collection('attachments');
    firebaseReady = true;
    return true;
  }catch(e){
    setRoomStatus(false, "Firebase 연결 실패 (설정을 확인하세요)");
    return false;
  }
}
function setRoomStatus(on, text){
  const dot = document.getElementById('roomDot');
  const status = document.getElementById('roomStatus');
  if(dot) dot.classList.toggle('on', !!on);
  if(status) status.textContent = text;

function isEditingNow(){
  const el = document.activeElement;
  return !!(el && (el.tagName==='TEXTAREA' || (el.tagName==='INPUT' && el.type==='text')));
}

let pendingRemote = null;
let pendingAttachmentsSnap = null;
function mergeIntoFreshState(parsed){
  const base = freshState();
  const merged = Object.assign(base, parsed);
  merged.shared = Object.assign(base.shared, parsed.shared||{});
  merged.shared.topic = Object.assign(base.shared.topic, (parsed.shared&&parsed.shared.topic)||{});
  merged.plan = Object.assign(base.plan, parsed.plan||{});
  merged.plan.sessions = Object.assign(base.plan.sessions, (parsed.plan&&parsed.plan.sessions)||{});
  merged.report = Object.assign(base.report, parsed.report||{});
  merged.report.sections = Object.assign(base.report.sections, (parsed.report&&parsed.report.sections)||{});
  if(!merged.report.references || !merged.report.references.length) merged.report.references=[{author:"",title:"",source:"",year:""}];
  return merged;
}
function applyRemoteState(parsed, keepLocalNav){
  const nav = {mode:state.mode, planCurrent:state.plan.current, reportCurrent:state.report.current, openUnit:state.openUnit};
  const savedAttachSessions = {}, savedAttachSections = {};
  if(firebaseReady){
    // Firebase 모드에서는 첨부 이미지가 별도 컬렉션에서 관리되므로, 방금 불러온 이미지들을 유지한다
    for(const k in state.plan.sessions) savedAttachSessions[k] = state.plan.sessions[k].attachments;
    for(const k in state.report.attachmentsBySection) savedAttachSections[k] = state.report.attachmentsBySection[k];
  }
  state = mergeIntoFreshState(parsed);
  if(firebaseReady){
    for(const k in state.plan.sessions) if(savedAttachSessions[k]) state.plan.sessions[k].attachments = savedAttachSessions[k];
    for(const k in state.report.attachmentsBySection) if(savedAttachSections[k]) state.report.attachmentsBySection[k] = savedAttachSections[k];
  }
  if(keepLocalNav){
    state.mode = nav.mode; state.plan.current = nav.planCurrent;
    state.report.current = nav.reportCurrent; state.openUnit = nav.openUnit;
  }
  renderAll();
}
function applyAttachmentsSnapshot(snap){
  for(const k in state.plan.sessions) state.plan.sessions[k].attachments = [];
  for(const k in state.report.attachmentsBySection) state.report.attachmentsBySection[k] = [];
  snap.forEach(doc=>{
    const d = doc.data();
    if(!d || !d.container) return;
    const item = {id:doc.id, dataUrl:d.dataUrl, caption:d.caption||""};
    if(d.container.indexOf('plan-')===0){
      const n = d.container.slice(5);
      if(state.plan.sessions[n]) state.plan.sessions[n].attachments.push(item);
    } else if(d.container.indexOf('report-')===0){
      const key = d.container.slice(7);
      if(!state.report.attachmentsBySection[key]) state.report.attachmentsBySection[key] = [];
      state.report.attachmentsBySection[key].push(item);
    }
  });
}

async function loadState(){
  const ok = initFirebase();
  if(!ok){
    // localStorage fallback (혼자 쓰거나 Firebase 미설정 시) — 이 모드에서는 첨부 이미지도 state 안에 그대로 저장됨
    try{
      const raw = localStorage.getItem('workspace-v1');
      if(raw) applyRemoteState(JSON.parse(raw), false);
      else renderAll();
    }catch(e){ renderAll(); }
    return;
  }
  try{
    const snap = await docRef.get();
    if(snap.exists && snap.data() && snap.data().state){
      applyRemoteState(JSON.parse(snap.data().state), false);
    } else {
      await docRef.set({ state: JSON.stringify(stateForSave()), _writer: CLIENT_ID, _updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
    }
    const attachSnap = await attachmentsColRef.get();
    applyAttachmentsSnapshot(attachSnap);
    renderAll();
    setRoomStatus(true, "실시간 연결됨 · 모둠원과 함께 편집 중");
    startSync();
    startAttachmentsSync();
  }catch(e){
    setRoomStatus(false, "연결 실패 — 이 브라우저에만 임시 저장됩니다");
    renderAll();
  }
}

function startSync(){
  docRef.onSnapshot(snap=>{
    if(!snap.exists) return;
    const data = snap.data();
    if(!data || data._writer === CLIENT_ID) return; // 내가 방금 쓴 내용은 무시
    if(isEditingNow()){ pendingRemote = data; return; }
    applyRemoteState(JSON.parse(data.state), true);
    setRoomStatus(true, "실시간 연결됨 · 모둠원이 방금 내용을 수정했어요");
  }, ()=>{ setRoomStatus(false, "연결이 끊겼습니다"); });
}
function startAttachmentsSync(){
  attachmentsColRef.onSnapshot(snap=>{
    if(isEditingNow()){ pendingAttachmentsSnap = snap; return; }
    applyAttachmentsSnapshot(snap);
    renderView();
  }, ()=>{});
}
document.addEventListener('focusout', ()=>{
  setTimeout(()=>{
    if(isEditingNow()) return;
    let changed = false;
    if(pendingRemote){
      applyRemoteState(JSON.parse(pendingRemote.state), true);
      pendingRemote = null;
      changed = true;
    }
    if(pendingAttachmentsSnap){
      applyAttachmentsSnapshot(pendingAttachmentsSnap);
      pendingAttachmentsSnap = null;
      changed = true;
    }
    if(changed){ renderAll(); setRoomStatus(true, "실시간 연결됨 · 모둠원의 수정 내용을 반영했어요"); }
  }, 250);
});

function stateForSave(){
  // Firebase 모드에서는 첨부 이미지가 별도 컬렉션에 저장되므로, 메인 state 문서에는 담지 않는다 (저장 속도 개선)
  if(!firebaseReady) return state;
  const clone = JSON.parse(JSON.stringify(state));
  for(const k in clone.plan.sessions) clone.plan.sessions[k].attachments = [];
  for(const k in clone.report.attachmentsBySection) clone.report.attachmentsBySection[k] = [];
  return clone;
}

function scheduleSave(){
  const note = document.getElementById('saveNote');
  note.textContent = "저장 중…";
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    try{
      if(firebaseReady && docRef){
        await docRef.set({ state: JSON.stringify(stateForSave()), _writer: CLIENT_ID, _updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
        note.textContent = "실시간 저장됨 · " + new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});
      } else {
        localStorage.setItem('workspace-v1', JSON.stringify(state));
        note.textContent = "이 브라우저에 저장됨 · " + new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});
      }
    }catch(e){ note.textContent = "저장 실패 (다시 시도합니다)"; }
  }, 500);
}

/* ================= progress helpers ================= */
function planProgressOf(n){
  const s = state.plan.sessions[n];
  if(!s.checklist.length) return 0;
  return s.checklist.filter(c=>c.done).length / s.checklist.length;
}
function planIsDone(n){ return planProgressOf(n) >= 0.999; }
function planOverallProgress(){
  let sum=0; SESSION_META.forEach(s=> sum+=planProgressOf(s.n));
  return sum / SESSION_META.length;
}
function reportSectionRatio(key){
  if(key==="references"){
    return state.report.references.some(r=> r.author.trim()||r.title.trim()||r.source.trim()) ? 1 : 0;
  }
  const defs = FIELD_DEFS[key], s = state.report.sections[key];
  const c = defs.filter(f=> s[f.id] && s[f.id].trim().length>0).length;
  return c/defs.length;
}
function reportOverallProgress(){
  let sum=0; SECTIONS.forEach(s=> sum+=reportSectionRatio(s.key));
  return sum / SECTIONS.length;
}

/* ================= PLAN view ================= */
function buildSmoothPath(points){
  let d = `M ${points[0].x} ${points[0].y}`;
  for(let i=0;i<points.length-1;i++){
    const p0=points[i], p1=points[i+1], dx=(p1.x-p0.x)/2;
    d += ` C ${p0.x+dx} ${p0.y}, ${p1.x-dx} ${p1.y}, ${p1.x} ${p1.y}`;
  }
  return d;
}
function renderPlanJourney(){
  const W=720, H=190;
  const xs=[110,360,610], ys=[145,85,25];
  const pts = xs.map((x,i)=>({x,y:ys[i]}));
  const pathD = buildSmoothPath(pts);
  let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" xmlns="http://www.w3.org/2000/svg">`;
  svg += `<path d="${pathD}" fill="none" stroke="#D3DAE6" stroke-width="3"/>`;
  const doneCount = SESSION_META.filter(s=>planIsDone(s.n)).length;
  if(doneCount>0){
    const donePts = pts.slice(0, Math.min(doneCount, pts.length));
    if(donePts.length>1) svg += `<path d="${buildSmoothPath(donePts)}" fill="none" stroke="#227C70" stroke-width="3" stroke-linecap="round"/>`;
  }
  SESSION_META.forEach((s,i)=>{
    const p = pts[i], active = state.plan.current===s.n, done = planIsDone(s.n);
    svg += `<g class="node-circle" data-n="${s.n}" transform="translate(${p.x},${p.y})">
      <circle r="16" fill="#fff" stroke="${done?'#227C70':(active?'#227C70':'#C7D0DE')}" stroke-width="${active?3:2}" ${done?'fill="#227C70"':''}/>
      <text text-anchor="middle" dy="5" font-family="ui-monospace,monospace" font-size="12" font-weight="700" fill="${done?'#fff':'#16213E'}">${s.n}</text>
      <text text-anchor="middle" y="34" font-family="-apple-system,sans-serif" font-size="11" fill="${active?'#16213E':'#8B93AC'}" font-weight="${active?'700':'400'}">${s.title.length>10? s.title.slice(0,9)+'…':s.title}</text>
    </g>`;
  });
  svg += `</svg>`;
  document.getElementById('journeySvgWrap').innerHTML = svg;
  document.querySelectorAll('.node-circle').forEach(el=> el.addEventListener('click', ()=>{ state.plan.current=+el.getAttribute('data-n'); renderAll(); }));

  let mhtml = SESSION_META.map(s=>{
    const active = state.plan.current===s.n, done = planIsDone(s.n);
    return `<div class="jm-item ${active?'active':''} ${done?'done':''}" data-n="${s.n}">
      <div class="jm-dot">${done?'✓':s.n}</div>
      <div class="jm-body"><div class="t">${s.tag} · ${s.title}</div><div class="s">${done?'완료':(active?'진행 중':'대기')}</div></div>
    </div>`;
  }).join('');
  document.getElementById('journeyMobile').innerHTML = mhtml;
  document.querySelectorAll('.jm-item').forEach(el=> el.addEventListener('click', ()=>{ state.plan.current=+el.getAttribute('data-n'); renderAll(); }));
}

    txt += "[주요 활동]\n" + s.activities.filter(a=>a.trim()).map(a=>"- "+a).join("\n") + "\n\n";
  }
  if(s.output) txt += "[산출물] " + s.output;
  return txt.trim();
}
function renderReportPanel(){
  const sec = SECTIONS[state.report.current];
  const panel = document.getElementById('reportPanel');

  if(sec.key==="references"){ renderReferencesPanel(panel, sec); return; }

  const defs = FIELD_DEFS[sec.key];
  const s = state.report.sections[sec.key];

  const topicBlock = sec.key==="intro" ? `
    <div class="field-block">
      <div class="field-label">탐구 주제</div>
      <div class="topic-compact">
        <div class="txt"><b>선정된 주제</b>${state.shared.topic.topic ? escapeHtml(state.shared.topic.topic) + (state.shared.topic.unit?` (${escapeHtml(state.shared.topic.unit)})`:'') : '아직 선택되지 않았습니다.'}</div>
        <button class="linklike" id="gotoTopicFromReport">개요에서 주제 편집 →</button>
      </div>
    </div>` : "";

  const fieldsHtml = defs.map(f=>`
    <div class="field-block">
      <div class="field-label">${f.label}</div>
      <p class="field-hint">${f.hint}</p>
      <textarea data-id="${f.id}" rows="4">${escapeHtml(s[f.id])}</textarea>
      ${f.importFrom ? `<button class="import-btn" data-import="${f.id}" data-from="${f.importFrom}" type="button">↧ 기획안 ${f.importFrom}차시 내용 불러오기</button>` : ""}
    </div>`).join('');

  if(!state.report.attachmentsBySection) state.report.attachmentsBySection = {};
  if(!state.report.attachmentsBySection[sec.key]) state.report.attachmentsBySection[sec.key] = [];
  const attachBlock = renderAttachmentsBlockHtml('attach-report-'+sec.key);

  panel.innerHTML = `
    <div class="panel-head"><span class="section-tag">${sec.roman}</span><h2>${sec.title}</h2></div>
    <p class="panel-desc">${sec.desc}</p>
    ${topicBlock}
    ${fieldsHtml}
    ${attachBlock}
    <div class="panel-nav">
      <button class="nav-btn" id="prevBtn" ${state.report.current===0?'disabled':''}>← 이전</button>
      <button class="nav-btn primary" id="nextBtn" ${state.report.current===SECTIONS.length-1?'disabled':''}>다음 →</button>
    </div>
  `;

  panel.querySelectorAll('textarea[data-id]').forEach(ta=> ta.addEventListener('input', ()=>{ s[ta.getAttribute('data-id')]=ta.value; scheduleSave(); renderToc(); renderTabs(); }));
  panel.querySelectorAll('[data-import]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const fid = btn.getAttribute('data-import'), from = +btn.getAttribute('data-from');
      const imported = importFromPlan(from);
      if(s[fid] && s[fid].trim()){
        if(!confirm('이미 작성된 내용이 있습니다. 기획안 내용을 이어서 추가할까요?')) return;
        s[fid] = s[fid] + "\n\n---\n" + imported;
      } else {
        s[fid] = imported;
      }
      scheduleSave(); renderReportPanel(); renderToc(); renderTabs();
    });
  });
  const gotoBtn = document.getElementById('gotoTopicFromReport');
  if(gotoBtn) gotoBtn.addEventListener('click', ()=>{ state.mode='overview'; renderAll(); });
  bindAttachmentsBlock('attach-report-'+sec.key, 'report-'+sec.key, state.report.attachmentsBySection[sec.key]);

  bindReportNav();
}

/* ---- 사진/스캔 첨부 (모든 차시·섹션 공용) ---- */
function renderAttachmentsBlockHtml(idPrefix){
  return `
    <div class="field-block">
      <div class="field-label">사진 / 스캔 첨부</div>
      <p class="field-hint">손으로 푼 수식, 그래프, 계산 과정을 사진이나 스캔본으로 찍어 올리세요. 자동으로 크기를 줄여 저장하며, 미리보기·인쇄 문서에도 함께 나옵니다. (한 장당 용량이 크면 저장이 느려지거나 실패할 수 있으니, 너무 고화질 원본보다는 적당히 압축된 사진을 권장합니다.)</p>
      <input type="file" id="${idPrefix}-input" accept="image/*" multiple style="margin-bottom:10px;">
      <div id="${idPrefix}-grid" style="display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:12px;"></div>
    </div>`;
}
function fileToResizedDataUrl(file, maxW){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = reject;
      img.onload = ()=>{
        const scale = Math.min(1, maxW / img.width);
        const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.72));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
const captionTimers = {};
function scheduleCaptionSave(container, item){
  clearTimeout(captionTimers[item.id]);
  captionTimers[item.id] = setTimeout(()=>{
    if(firebaseReady && attachmentsColRef && String(item.id).indexOf('local-')!==0){
      attachmentsColRef.doc(item.id).update({caption:item.caption}).catch(()=>{});
    } else {
      scheduleSave();
    }
  }, 500);
}
function renderAttachGrid(idPrefix, container, list){
  const grid = document.getElementById(idPrefix+'-grid');
  if(!grid) return;
  grid.innerHTML = list.map((a,i)=>`
    <div style="border:1px solid var(--line); border-radius:9px; overflow:hidden; background:#FBFCFE;">
      <img src="${a.dataUrl}" style="width:100%; display:block; max-height:150px; object-fit:cover;">
      <div style="padding:7px 8px;">
        <input class="text-input" data-i="${i}" placeholder="설명 (예: 결과 그래프)" value="${escapeAttr(a.caption||'')}" style="font-size:12px; padding:6px 8px; margin-bottom:6px;">
        <button class="row-del" data-i="${i}" style="width:100%;">삭제</button>
      </div>
    </div>`).join('');
  grid.querySelectorAll('input[data-i]').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const item = list[+inp.dataset.i];
      item.caption = inp.value;
      scheduleCaptionSave(container, item);
    });
  });
  grid.querySelectorAll('.row-del').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const item = list[+btn.dataset.i];
      if(firebaseReady && attachmentsColRef && String(item.id).indexOf('local-')!==0){
        attachmentsColRef.doc(item.id).delete().catch(()=>{});
        // 삭제 결과는 실시간 리스너를 통해 화면에 반영됨
      } else {
        list.splice(+btn.dataset.i,1);
        renderAttachGrid(idPrefix, container, list);
        scheduleSave();
      }
    });
  });
}
function bindAttachmentsBlock(idPrefix, container, list){
  renderAttachGrid(idPrefix, container, list);
  const input = document.getElementById(idPrefix+'-input');
  if(!input) return;
  input.addEventListener('change', async (e)=>{
    const files = Array.from(e.target.files || []);
    for(const file of files){
      try{
        const dataUrl = await fileToResizedDataUrl(file, 900);
        if(firebaseReady && attachmentsColRef){
          // 별도 컬렉션에 개별 저장 → 다른 필드 저장 속도에 영향 없음. 업로드 결과는 실시간 리스너로 화면에 반영됨.
          await attachmentsColRef.add({ container, dataUrl, caption:"", createdAt: firebase.firestore.FieldValue.serverTimestamp() });
        } else {
          list.push({id:'local-'+Math.random().toString(36).slice(2), dataUrl, caption:""});
          renderAttachGrid(idPrefix, container, list);
          scheduleSave();
        }
      }catch(err){ /* 개별 파일 실패는 무시하고 계속 */ }
    }
    input.value = "";
  });
}
function renderReferencesPanel(panel, sec){
  if(!state.report.attachmentsBySection) state.report.attachmentsBySection = {};
  if(!state.report.attachmentsBySection.references) state.report.attachmentsBySection.references = [];
  panel.innerHTML = `
    <div class="panel-head"><span class="section-tag">${sec.roman}</span><h2>${sec.title}</h2></div>
    <p class="panel-desc">${sec.desc}</p>
    <p class="field-hint" style="margin-bottom:14px;">표기 예시: 저자(연도). 『자료명』. 출처(발행처/URL 등).</p>
    <div class="ref-rows" id="refRows"></div>
    <button class="add-btn" id="addRef" type="button">+ 참고문헌 추가</button>
    ${renderAttachmentsBlockHtml('attach-report-references')}
    <div class="panel-nav">
      <button class="nav-btn" id="prevBtn">← 이전</button>
      <button class="nav-btn primary" id="nextBtn" disabled>완료</button>
    </div>
  `;
  renderRefRows();
  bindAttachmentsBlock('attach-report-references', 'report-references', state.report.attachmentsBySection.references);
  document.getElementById('addRef').addEventListener('click', ()=>{ state.report.references.push({author:"",title:"",source:"",year:""}); renderRefRows(); scheduleSave(); renderToc(); renderTabs(); });
  bindReportNav();
  function renderRefRows(){
    const wrap = document.getElementById('refRows');
    wrap.innerHTML = state.report.references.map((r,i)=>`
      <div class="ref-row">
        <button class="ref-del" data-i="${i}">×</button>
        <input class="ref-title" data-i="${i}" data-f="title" placeholder="자료명 (제목)" value="${escapeAttr(r.title)}">
        <div class="ref-grid">
          <input data-i="${i}" data-f="author" placeholder="저자 / 기관" value="${escapeAttr(r.author)}">
          <input data-i="${i}" data-f="source" placeholder="출처 (발행처 / URL)" value="${escapeAttr(r.source)}">
          <input data-i="${i}" data-f="year" placeholder="연도" value="${escapeAttr(r.year)}">
        </div>
      </div>`).join('');
    wrap.querySelectorAll('input').forEach(inp=> inp.addEventListener('input', ()=>{ state.report.references[+inp.dataset.i][inp.dataset.f]=inp.value; scheduleSave(); renderToc(); renderTabs(); }));
    wrap.querySelectorAll('.ref-del').forEach(btn=> btn.addEventListener('click', ()=>{
      state.report.references.splice(+btn.dataset.i,1);
      if(!state.report.references.length) state.report.references.push({author:"",title:"",source:"",year:""});
      renderRefRows(); scheduleSave(); renderToc(); renderTabs();
    }));
  }
}
function bindReportNav(){
  const prevBtn = document.getElementById('prevBtn'), nextBtn = document.getElementById('nextBtn');
  if(prevBtn) prevBtn.addEventListener('click', ()=>{ if(state.report.current>0){ state.report.current--; renderAll(); }});
  if(nextBtn) nextBtn.addEventListener('click', ()=>{ if(state.report.current<SECTIONS.length-1){ state.report.current++; renderAll(); }});
}

/* ================= preview / print ================= */
function openPreview(){
  if(state.mode==='report') renderReportDoc();
  else renderPlanDoc();
  document.getElementById('modalOverlay').classList.add('open');
}
function closePreview(){ document.getElementById('modalOverlay').classList.remove('open'); }

function renderAttachmentsDocHtml(list){
  if(!list || !list.length) return "";
  return `<p><b>첨부 사진/스캔</b></p><div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:4px;">`
    + list.map(a=>`<div><img src="${a.dataUrl}" style="width:100%;border-radius:6px;border:1px solid var(--line);">${a.caption?`<p style="font-size:11.5px;color:var(--ink-soft);margin:4px 0 0;">${escapeHtml(a.caption)}</p>`:''}</div>`).join('')
    + `</div>`;
}
function renderPlanDoc(){
  const sh = state.shared;
  let html = `<button class="doc-close" id="docClose">×</button>`;
  html += `<div class="doc-body" style="padding-top:44px;">
    <h1 class="doc-title" style="text-align:center;font-size:22px;margin-bottom:4px;">${escapeHtml(sh.title || "수학주제탐구 발표회 기획안")}</h1>
    <p style="text-align:center;color:var(--ink-soft);font-family:var(--mono);font-size:12px;margin-bottom:22px;">고등학교 1학년 공통수학 연계 탐구 · 6차시</p>
    <table class="doc-cover-table" style="width:100%;margin-bottom:24px;">
      <tr><td class="k">모둠명</td><td>${escapeHtml(sh.team)||'-'}</td><td class="k">지도교사</td><td>${escapeHtml(sh.teacher)||'-'}</td></tr>
      <tr><td class="k">모둠원</td><td colspan="3">${escapeHtml(sh.members)||'-'}</td></tr>
      <tr><td class="k">탐구 주제</td><td colspan="3">${escapeHtml(sh.topic.topic)||'-'} ${sh.topic.unit?`<span style="color:#8B93AC;">(연계 단원: ${escapeHtml(sh.topic.unit)})</span>`:''}</td></tr>
      <tr><td class="k">선정 이유</td><td colspan="3">${escapeHtml(sh.topic.reason)||'-'}</td></tr>
    </table>
    <h2 style="font-size:15px;border-bottom:2px solid var(--ink);padding-bottom:6px;">차시별 계획</h2>`;
  SESSION_META.forEach(meta=>{
    const s = state.plan.sessions[meta.n];
    html += `<div class="doc-section">
      <h2 style="font-size:14px;">${meta.tag} · ${escapeHtml(meta.title)}</h2>
      <p><b>목표</b> ${escapeHtml(s.goal)}</p>
      <p><b>활동</b></p>
      <ul>${s.activities.filter(a=>a.trim()).map(a=>`<li>${escapeHtml(a)}</li>`).join('') || '<li>-</li>'}</ul>
      <p><b>산출물</b> ${escapeHtml(s.output)||'-'}</p>
      <p><b>체크리스트</b></p>
      <ul>${s.checklist.filter(c=>c.text.trim()).map(c=>`<li>${c.done?'✅':'⬜'} ${escapeHtml(c.text)}</li>`).join('') || '<li>-</li>'}</ul>
      ${s.notes.trim() ? `<p><b>메모</b> ${escapeHtml(s.notes)}</p>` : ''}
      ${(s.teacherFeedback||'').trim() ? `<p><b>교사 피드백</b> ${escapeHtml(s.teacherFeedback)}</p>` : ''}
      ${renderAttachmentsDocHtml(s.attachments)}
    </div>`;
  });
  html += `</div>`;
  document.getElementById('docContent').innerHTML = html;
  document.getElementById('docClose').addEventListener('click', closePreview);
}
function renderReportDoc(){
  const sh = state.shared;
  let html = `<button class="doc-close" id="docClose">×</button>`;
  html += `
    <div class="doc-cover">
      <div class="k1">공통수학 연계 · 수학주제탐구 발표회</div>
      <h1>${escapeHtml(sh.title || "제목 없음")}</h1>
      <div class="k2">${escapeHtml(sh.topic.topic)}${sh.topic.unit?` (연계 단원: ${escapeHtml(sh.topic.unit)})`:''}</div>
      <table class="doc-cover-table">
        <tr><td class="k">학교 / 학급</td><td>${escapeHtml(sh.school)||'-'}</td></tr>
        <tr><td class="k">모둠명</td><td>${escapeHtml(sh.team)||'-'}</td></tr>
        <tr><td class="k">모둠원</td><td>${escapeHtml(sh.members)||'-'}</td></tr>
        <tr><td class="k">지도교사</td><td>${escapeHtml(sh.teacher)||'-'}</td></tr>
        <tr><td class="k">작성일</td><td>${escapeHtml(sh.date)||'-'}</td></tr>
      </table>
    </div>
    <div class="doc-body">
      <div class="doc-toc">
        <h2 style="font-size:15px;border-bottom:2px solid var(--ink);padding-bottom:6px;">목차</h2>
        ${SECTIONS.map(s=>`<div>${s.roman}. ${s.title}</div>`).join('')}
      </div>`;
  SECTIONS.forEach(sec=>{
    html += `<div class="doc-section"><h2>${sec.roman}. ${sec.title}</h2>`;
    if(sec.key==="references"){
      const filled = state.report.references.filter(r=> r.author.trim()||r.title.trim()||r.source.trim());
      if(!filled.length) html += `<p>-</p>`;
      else filled.forEach(r=> html += `<p class="doc-ref">${escapeHtml(r.author)}${r.author&&r.year?'(' + escapeHtml(r.year) + ')':''}. 『${escapeHtml(r.title)}』. ${escapeHtml(r.source)}</p>`);
      html += renderAttachmentsDocHtml((state.report.attachmentsBySection||{}).references);
    } else {
      FIELD_DEFS[sec.key].forEach(f=>{
        const v = state.report.sections[sec.key][f.id];
        html += `<h3>${f.label}</h3><p>${escapeHtml(v) || '-'}</p>`;
      });
      html += renderAttachmentsDocHtml((state.report.attachmentsBySection||{})[sec.key]);
    }
    html += `</div>`;
  });
  html += `</div>`;
  document.getElementById('docContent').innerHTML = html;
  document.getElementById('docClose').addEventListener('click', closePreview);
}

/* ================= utils ================= */
function escapeHtml(str){ return String(str==null?'':str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(str){ return escapeHtml(str).replace(/"/g,'&quot;'); }

/* ================= boot ================= */
function renderView(){
  if(state.mode==='overview') renderOverview();
  else if(state.mode==='plan') renderPlanView();
  else renderReportView();
}
function renderAll(){ renderTabs(); renderView(); }

document.getElementById('previewBtn').addEventListener('click', openPreview);
document.getElementById('modalOverlay').addEventListener('click', (e)=>{ if(e.target.id==='modalOverlay') closePreview(); });
document.getElementById('resetBtn').addEventListener('click', ()=>{
  if(confirm('기획안과 보고서 내용을 모두 초기화할까요? 되돌릴 수 없습니다.')){
    state = freshState(); scheduleSave(); renderAll();
  }
});

document.getElementById('copyLinkBtn').addEventListener('click', async ()=>{
  try{
    await navigator.clipboard.writeText(location.href);
    const btn = document.getElementById('copyLinkBtn');
    const old = btn.textContent; btn.textContent = "복사됨!";
    setTimeout(()=> btn.textContent = old, 1500);
  }catch(e){
    alert(location.href);
  }
});

function goToRoom(code){
  const clean = code.toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,12);
  if(!clean){ alert('영문/숫자로 모둠 코드를 입력해주세요.'); return; }
  location.href = location.pathname + '?room=' + clean;
}
document.getElementById('joinRoomBtn').addEventListener('click', ()=>{
  const v = document.getElementById('roomInput').value.trim();
  if(!v){ alert('이동할 모둠 코드를 입력해주세요. (예: team2, 1모둠 → team1 처럼 영문/숫자로)'); return; }
  goToRoom(v);
});
document.getElementById('roomInput').addEventListener('keydown', (e)=>{
  if(e.key === 'Enter') document.getElementById('joinRoomBtn').click();
});
document.getElementById('newRoomBtn').addEventListener('click', ()=>{
  if(!confirm('현재 모둠 데이터와 별개로, 완전히 새로운 빈 모둠 작업공간을 만들까요?')) return;
  const code = Math.random().toString(36).slice(2,8);
  goToRoom(code);
});

loadState();
</script>
